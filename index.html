<!doctype html>
<html lang="en">

      property="og:description"

      name="twitter:description"
      content="Analyze your resume for ATS compatibility, keyword alignment, formatting, readability and job-description matching with ResumeIQ by CometCode Innovations."

        "publisher": {
          "@type": "Organization",
          "name": "CometCode Innovations"
        },
        "offers": {

        }

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
